name: Validate cartridge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARTKIT_REPO: bryanthaboi/gen1recomp
  CARTKIT_REF: dev

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject obvious ROM/save files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname '*.gb' -o -iname '*.gbc' -o -iname '*.rom' -o -iname '*.sav' -o -iname '*.srm' \) -print -quit | grep -q .; then
            echo "ROM/save file detected. These files must not be committed."
            exit 1
          fi
      - name: Check required cartridge files
        shell: bash
        run: |
          set -euo pipefail
          test -f cart.json
          test -f label.png
          test -f docs/MODLIST.md
          test -f docs/COMPATIBILITY.md
          test -f docs/CREDITS.md
      - name: Prepare launcher-compatible label
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          p = "label.png"
          with Image.open(p) as src:
              img = src.convert("RGB")
              if img.size != (512, 512):
                  img = img.resize((512, 512), Image.Resampling.LANCZOS)
              img.save(p, format="PNG", optimize=True, compress_level=9)
          PY
          python3 - <<'PY'
          from PIL import Image
          import os
          with Image.open("label.png") as img:
              assert img.format == "PNG"
              assert img.mode == "RGB"
              assert img.size == (512, 512)
          assert os.path.getsize("label.png") < 256 * 1024
          PY
      - name: Fetch upstream cartkit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cartkit.py" "https://raw.githubusercontent.com/$CARTKIT_REPO/$CARTKIT_REF/tools/cartkit.py"
          python3 "$RUNNER_TEMP/cartkit.py" selftest --quiet
      - name: Validate cart manifest and published pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cartkit.py" validate . --online --strict
      - name: Test cartridge packaging
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 "$RUNNER_TEMP/cartkit.py" pack . -o "dist/validation.g1rcart" --online
          test -s dist/validation.g1rcart
